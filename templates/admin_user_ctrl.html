<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Summary</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
        }

        .navbar {
            background: linear-gradient(135deg, black, #34495e);
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
        }

        .navbar-brand {
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .search-container {
            margin-top: 40px;
        }

        .search-form {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fff;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .search-form select,
        .search-form input[type="text"] {
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 8px;
            margin-right: 10px;
            width: 200px;
        }

        .search-form button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
        }

        .search-form button:hover {
            background-color: #0056b3;
        }

        .search-results {
            margin-top: 30px;
        }

        .search-results table {
            width: 100%;
            border-collapse: collapse;
            margin: 0 auto;
        }

        .search-results th,
        .search-results td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        .search-results th {
            background-color: #343a40;
            color: white;
        }

        .search-results tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        .search-results tr:hover {
            background-color: #e9ecef;
        }

        .footer {
            text-align: center;
            padding: 20px;
            background-color: #343a40;
            color: #999;
            margin-top: 30px;
        }

    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Admin Panel</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="{{url_for('admin_dashboard')}}"><i class="fas fa-book"></i> Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link " href="{{url_for('admin_summary')}}"><i class="fas fa-chart-line"></i> Summary</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{url_for('admin_search')}}"><i class="fas fa-question-circle"></i> Search</a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{url_for('home')}}"><i class="fas fa-sign-out-alt"></i> Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="search-container">
            <form method="POST" action="{{ url_for('user_control') }}" class="search-form">
                <input type="text" name="query" id="searchQuery" placeholder="Enter Usernme to block" required>
                <button type="submit"><i class="fas fa-search"></i> Search</button>
            </form>
            <div class="search-results" id="searchResults">
                {% if user_info %}
                <div class="search-result">
                    <table>
                        <thead>
                            <tr>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Active Status</th>
                                <th>CHANGE STATUS</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>{{ user_info.username }}</td>
                                <td>{{ user_info.email }}</td>
                                <td>{{ user_info.is_active }}</td>
                                <td>
                                    {% if user_info.is_active == True %}
                                        <a class="btn btn-danger" href="{{ url_for('block_user', username=user_info.username) }}">Block</a>
                                    {% else %}
                                        <a class="btn btn-success" href="{{ url_for('unblock_user', username=user_info.username) }}">Unblock</a>
                                    {% endif %}
                                </td>
                            </tr>
                        </tbody>
                        
                </div>
                {% endif %}
            </div>
</body>
</html>
