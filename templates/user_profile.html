<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif; 
            background-color: #0e0e0e; 
            color: #f4f4f4;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .navbar {
            background: linear-gradient(135deg, #4e54c8, #8f94fb); 
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4); 
            position: sticky; 
            top: 0;
            z-index: 100; 
        }

        .navbar h1 {
            font-size: 28px;
            font-weight: 700;
            color: white;
            letter-spacing: 1px;
        }

        .navbar .nav-links {
            display: flex;
            gap: 25px; 
        }

        .navbar .nav-links a {
            color: white;
            font-size: 15px; 
            transition: transform 0.3s ease, color 0.3s ease;
            display: flex; 
            align-items: center; 
            gap: 5px; 
        }

        .navbar .nav-links a:hover {
            color: #b3e5fc; 
            transform: scale(1.05); 
        }

        .profile-container {
            padding: 40px 30px;
            max-width: 1300px;
            margin: 30px auto;
        }

        .profile-card {
            background: linear-gradient(145deg, #1a1a1a, #292929);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            margin-bottom: 30px;
            border: 1px solid #333;
        }

        .profile-card h2 {
            font-size: 26px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .profile-info {
            font-size: 16px;
            color: #bbb;
            margin-bottom: 15px;
        }

        .profile-info span {
            font-weight: 600;
            color: #fff;
        }

        .profile-form input,
        .profile-form textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #ffffff;
            color: #000000;
            font-size: 16px;
        }

        .profile-form textarea {
            resize: vertical;
        }

        .profile-form button {
            padding: 10px 20px;
            background-color: #4e54c8;
            color: white;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .profile-form button:hover {
            background-color: #6f74dd;
            transform: scale(1.03);
        }

        .footer {
            text-align: center;
            padding: 20px;
            background-color: #1a1a1a;
            color: #999;
            margin-top: 50px;
            border-top: 1px solid #333;
        }

        @media (max-width: 992px) {
            .navbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .profile-card {
                padding: 20px;
                margin-bottom: 20px;
            }

            .profile-form input,
            .profile-form textarea {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <h1>Dashboard</h1>
        <div class="nav-links">
            <a href="{{url_for('user_dashboard', id=user_id)}}">Dashboard <i class="fas fa-tachometer-alt"></i></a>
            <a href="{{url_for('login')}}">Logout <i class="fas fa-sign-out-alt"></i></a>
        </div>
    </div>

    <div class="profile-container">
        <div class="profile-card">
            <h2>User Profile</h2>

            <div class="profile-info">
                <span>Join On: </span> {{ user.created_at.strftime('%Y-%m-%d') }}
            </div>

            <form class="profile-form" action="{{url_for('user_profile', id=user.uuid)}}" method="POST">
                <div class="profile-info">
                    <label for="username">Username: </label>
                    <span>{{user.username}} 
                        <p><i>[Sorry! But you cannot change your user name]</i></p>
                    </span>
                </div>
                <div class="profile-info">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" value="{{ user.email }}" required>
                </div>
                <div class="profile-info">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" value="{{user.password}}" placeholder="New Password">
                </div>
                <div class="profile-info">
                    <label for="bio">YOUR ID:</label>
                    <span>{{user.uuid}}</span>
                </div>
                <button type="submit">Save Changes</button>
            </form>
        </div>
    </div>

    <div class="footer">
        <p>&copy; 2025 Ischool. All Rights Reserved.</p>
    </div>

</body>
</html>
