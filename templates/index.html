<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iSchool - Educational Quiz and Mocks</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
   
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
  
        body {
            font-family: 'Arial', sans-serif;
            background-image: url('/static/image1.png');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            color: #fff;
        }

        .background-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            animation: float 15s infinite;
        }

        .shape:nth-child(1) {
            width: 300px;
            height: 300px;
            top: -150px;
            left: -150px;
        }

        .shape:nth-child(2) {
            width: 200px;
            height: 200px;
            bottom: -100px;
            right: -100px;
            animation-delay: 2s;
        }

        .shape:nth-child(3) {
            width: 150px;
            height: 150px;
            bottom: 50%;
            right: 10%;
            animation-delay: 4s;
        }

        .header {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            z-index: 10;
            border-radius: 3rem;
            background: linear-gradient(rgba(122, 122, 122, 0.7), rgba(255, 255, 255, 0.7));
        }
        .logo {
            max-width: 120px;
        }

        .header-buttons {
            display: flex;
            gap: 20px;
        }

        .header-buttons a {
            text-decoration: none;
            font-size: 1.1rem;
            color: #fff;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 25px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .header-buttons a:hover {
            background-color: #ff6347;
            border-color: #ff6347;
        }

        .container {
            position: relative;
            z-index: 5;
            width: 90%;
            max-width: 600px;
            padding: 3rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(150px); 
            border-radius: 20px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            background: linear-gradient(92deg, #ff0000, #ff8c00, #a600ff);
            -webkit-background-clip: text;
            color: transparent;
            animation: gradient-animation 3s linear infinite;
            text-align: center;
            letter-spacing: 2px;
        }

        @keyframes gradient-animation {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .slogan {
            font-size: 2.5rem;
            margin-bottom: 40px;
            text-align: center;
            color: transparent;
            background: linear-gradient(to bottom, #3500f6, #3f1313);
            -webkit-background-clip: text;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .btn {
            padding: 15px 50px;
            font-size: 1.1rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.4s ease;
            font-weight: 600;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(252, 5, 5, 0.2), transparent);
            transition: 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-login {
            background: linear-gradient(45deg, #1100fe, #000000);
            color: white;
        }

        .btn-register {
            background: linear-gradient(45deg, #000000, #fc00ff);
            color: white;
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        @media (max-width: 768px) {
            .container {
                padding: 2rem;
            }

            h1 {
                font-size: 3rem;
            }

            .buttons {
                flex-direction: column;
                gap: 15px;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="header">
         <img src="/static/logo.png"alt="iSchool Logo" class="logo"/>

        <div class="header-buttons">
            <p style="padding-top: .99vh; color: #000000;">For Teachers Only</p>
            <a href="{{url_for('admin_dashboard')}}" class="btn-simple">
                <i class="fas fa-sign-in-alt"></i> Admin dashboard
            </a>

        </div>
    </div>

    <div class="container">
        <h1>Welcome to iSchool</h1>
        <h3 class="slogan">Start success with iSchool Tests and Quizes</h3>

        <div class="buttons">
            <a href="/login" class="btn btn-login">Login</a>
            <a href="/register" class="btn btn-register">Register</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
